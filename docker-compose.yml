services:
  jekyll:
    image: jekyll/jekyll:pages
    command: jekyll serve --host 0.0.0.0 --livereload --watch --incremental
    # Jekyll exits cleanly on SIGINT (Ctrl+C) but ignores SIGTERM, which made stop wait 10s
    stop_signal: SIGINT
    ports:
      - 4000:4000
      - 35729:35729
    volumes:
      - .:/srv/jekyll
